name: A12 deployed mobile and accessibility audit
on:
  push:
    branches: [fe12-performance-accessibility]
    paths:
      - '.github/workflows/a12-live-audit.yml'
      - 'scripts/capture-live-a12.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install official WAVE extension
        run: |
          curl -fL --max-time 60 -o /tmp/wave.crx 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=142.0.0.0&acceptformat=crx2,crx3&x=id%3Djbbplnpkjmmeebjpijfedlgcdilocofh%26uc'
          python3 - <<'PY'
          import zipfile
          zipfile.ZipFile('/tmp/wave.crx').extractall('/tmp/a12-wave')
          PY
      - name: Audit the actual production application
        env:
          WAVE_EXTENSION: /tmp/a12-wave
        run: node scripts/capture-live-a12.mjs
