name: A13 shader verification

on:
  push:
    branches: [fe13-fragment-shader]
    paths: ['src/**', 'scripts/verify-a13.mjs', 'package*.json', 'vite.config.ts', '.github/workflows/a13-shader.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a13-shader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser-test tooling
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Verify real shader and accessibility fallbacks
        run: xvfb-run -a node scripts/verify-a13.mjs
        env:
          A13_HEADFUL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a13-browser-evidence
          path: docs/assignment-13/evidence/
          retention-days: 30
