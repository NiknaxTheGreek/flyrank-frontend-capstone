name: A13 shader verification

on:
  push:
    branches: [fe13-fragment-shader]
    paths: ['src/**', 'scripts/verify-a13.mjs', 'package*.json', 'vite.config.ts', '.github/workflows/a13-shader.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a13-shader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser-test tooling
        run: npm install --prefix /tmp/a13-browser-tools --no-save --ignore-scripts playwright@1.62.1
      - run: /tmp/a13-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Add window manager for real visibility events
        run: sudo apt-get install -y --no-install-recommends openbox
      - run: npm test
      - run: npm run build
      - name: Verify real shader and accessibility fallbacks
        run: xvfb-run -a node scripts/verify-a13.mjs
        env:
          A13_HEADFUL: '1'
          A13_PLAYWRIGHT_MODULE: /tmp/a13-browser-tools/node_modules/playwright/index.mjs
