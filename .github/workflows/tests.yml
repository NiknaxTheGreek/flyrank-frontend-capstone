name: A10 Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a10-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    name: Component tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check application and test types
        run: npm run typecheck
      - name: Run Vitest and React Testing Library
        run: npm run test:ci
      - name: Publish component test summary
        if: always()
        run: node scripts/ci-test-summary.mjs
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: test-results/vitest-*
          retention-days: 30
  e2e:
    name: Playwright desktop and phone
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run mocked primary flow and retry journeys
        run: npm run test:e2e
      - name: Download component results for CI evidence
        uses: actions/download-artifact@v4
        with:
          name: vitest-report
          path: test-results
      - name: Capture screenshot of the actual CI test reports
        run: node scripts/ci-evidence.mjs
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
  merge-gate:
    name: A10 merge gate
    if: always()
    needs: [components, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both suites to pass
        env:
          COMPONENTS_RESULT: ${{ needs.components.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$COMPONENTS_RESULT" = success
          test "$E2E_RESULT" = success
